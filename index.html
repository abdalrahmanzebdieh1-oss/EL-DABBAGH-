function sanitize(str){
  if(str===null||str===undefined)return '';
  return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizeArabicInput(s){
  if(!s)return '';
  const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','ش':'a','لا':'b','ؤ':'c','ي':'d','ث':'e','ب':'f','ل':'g','ا':'h','ه':'i','ت':'j','ن':'k','م':'l','ة':'m','ى':'n','خ':'o','ح':'p','ض':'q','ق':'r','س':'s','ف':'t','ع':'u','ر':'v','ص':'w','ء':'x','غ':'y','ئ':'z'};
  return String(s).split('').map(c=>map[c]||c).join('');
}
function formatDirectImageUrl(url){
  if(!url)return '';
  const u=url.trim();
  const m=u.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]{15,})/);
  return m?`https://lh3.googleusercontent.com/d/${m[1]}`:u;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

  reconcileCart();

function showToast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=`<i data-lucide="check-circle-2" class="w-4 h-4"></i><span>${sanitize(msg)}</span>`;
  t.classList.remove('hidden');
  lucide.createIcons();
  setTimeout(()=>t.classList.add('hidden'),2600);
}
function isStoreOpen(){
  const {openTime,closeTime}=state.settings;
  if(!openTime||!closeTime)return true;
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const [oh,om]=openTime.split(':').map(Number);
  const [ch,cm]=closeTime.split(':').map(Number);
  const o=oh*60+om, c=ch*60+cm;
  return o<=c ? (cur>=o && cur<=c) : (cur>=o || cur<=c);
}
function reconcileCart(){
  cart=cart.filter(ci=>{
    const item=state.items.find(i=>i.id===ci.itemId && i.avail);
    if(!item)return false;
    ci.name=item.name;
    let base=Number(item.price)||0;
    if(ci.sizeName && item.sizes){
      const found=parseSizes(item.sizes).find(s=>s.name===ci.sizeName);
      if(found)base=found.price;
    }
    ci.basePrice=base;
    ci.extras=ci.extras.map(ex=>{
      const dbEx=state.extras.find(e=>e.name===ex.name);
      return dbEx?{name:dbEx.name,price:Number(dbEx.price)}:{...ex};
    });
    ci.unitPrice=ci.basePrice+ci.extras.reduce((a,b)=>a+b.price,0);
    return true;
  });
}
function parseSizes(s){
  if(!s)return [];
  return String(s).split(',').map(p=>{
    const [k,v]=p.split(':');
    return k&&v?{name:k.trim(),price:Number(v.trim())}:null;
  }).filter(Boolean);
}

window.calcCustomPrice=function(defaultBase){
  const sr=document.querySelector('input[name="cSize"]:checked');
  let base=sr?Number(sr.dataset.price):Number(defaultBase);
  let exSum=0;
  document.querySelectorAll('input[name="cExtra"]:checked').forEach(c=>exSum+=Number(c.dataset.price));
  const q=Number(document.getElementById('cQty').textContent)||1;
  document.getElementById('cTotalBtn').textContent=(base+exSum)*q;
};
window.addToCart=function(itemId){

  const sr=document.querySelector('input[name="cSize"]:checked');
  const sizeName=sr?sr.value:'';
  const basePrice=sr?Number(sr.dataset.price):Number(item.price);
  const extras=[];
  document.querySelectorAll('input[name="cExtra"]:checked').forEach(c=>extras.push({name:c.value,price:Number(c.dataset.price)}));
  const note=document.getElementById('cNote').value.trim();
  const qty=Number(document.getElementById('cQty').textContent)||1;
  const unitPrice=basePrice+extras.reduce((a,b)=>a+b.price,0);

window.modCartQty=function(cid,d){
  const idx=cart.findIndex(c=>c.id===cid);
  if(idx===-1)return;
  cart[idx].qty+=d;
  if(cart[idx].qty<=0)cart.splice(idx,1);
  updateCartUI();
  if(!cart.length){window.closeModal();return;}
  window.recalcCheckout();
};
window.applyCoupon=function(){
  const code=normalizeArabicInput(document.getElementById('cpInput').value.trim()).toUpperCase();
  const sub=cart.reduce((a,b)=>a+b.unitPrice*b.qty,0);
  const cp=state.coupons.find(c=>c.code.toUpperCase()===code);
  if(!cp){showToast("كود الكوبون غير صحيح");return;}
  if(sub<(Number(cp.min)||0)){showToast(`الحد الأدنى للكوبون ${cp.min} ج.م`);return;}
  appliedCoupon=cp;
  showToast("تم تفعيل الكوبون بنجاح!");
  window.recalcCheckout();
};
window.togglePayInfo=function(){
  const pm=document.querySelector('input[name="pMethod"]:checked').value;
  const box=document.getElementById('payTransferBox'), num=document.getElementById('payTransferNum');
  if(pm.includes('InstaPay')){box.classList.remove('hidden');num.textContent=`حساب إنستاباي: ${state.settings.instapay}`;}
  else if(pm.includes('محفظة')){box.classList.remove('hidden');num.textContent=`رقم المحفظة: ${state.settings.wallet}`;}
  else box.classList.add('hidden');

window.copyPayNum=function(){

window.recalcCheckout=function(){
  const list=document.getElementById('cartItemsList');
  if(!list)return;
  list.innerHTML=cart.map(c=>`<div class="theme-card p-2.5 rounded-xl flex justify-between items-center">
    <div>
      <div class="font-bold text-white">${sanitize(c.name)} ${c.sizeName?`<span class="text-yellow-400">(${sanitize(c.sizeName)})</span>`:''}</div>
      ${c.extras.length?`<div class="text-[10px] text-slate-300">إضافات: ${c.extras.map(e=>sanitize(e.name)).join('، ')}</div>`:''}
      ${c.note?`<div class="text-[10px] text-amber-300">ملاحظة: ${sanitize(c.note)}</div>`:''}
      <div class="text-yellow-400 font-extrabold mt-0.5">${c.unitPrice*c.qty} ج.م</div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="window.modCartQty(${c.id},-1)" class="w-6 h-6 rounded-lg bg-slate-900 text-yellow-400 font-black">-</button>
      <span class="font-black">${c.qty}</span>
      <button onclick="window.modCartQty(${c.id},1)" class="w-6 h-6 rounded-lg theme-btn">+</button>
    </div>
  </div>`).join('');
  const oType=document.querySelector('input[name="oType"]:checked')?.value||'delivery';
  document.getElementById('delivFields').classList.toggle('hidden',oType!=='delivery');
  const sub=cart.reduce((a,b)=>a+b.unitPrice*b.qty,0);
  const fee=oType==='delivery'?Number(document.getElementById('cZone')?.value||0):0;
  let disc=0;
  if(appliedCoupon){
    disc=appliedCoupon.type==='percent'?Math.round(sub*(Number(appliedCoupon.val)/100)):Number(appliedCoupon.val);
  }
  const grand=Math.max(0,sub-disc)+fee;
  document.getElementById('checkoutSummary').innerHTML=`
    <div class="flex justify-between"><span>المجموع الفرعي:</span><span>${sub} ج.م</span></div>
    ${disc?`<div class="flex justify-between text-emerald-400"><span>خصم الكوبون (${sanitize(appliedCoupon.code)}):</span><span>-${disc} ج.م</span></div>`:''}
    ${oType==='delivery'?`<div class="flex justify-between"><span>رسوم التوصيل:</span><span>${fee} ج.م</span></div>`:''}
    <div class="flex justify-between font-black text-sm text-yellow-400 pt-1 border-t border-yellow-400/20"><span>الإجمالي النهائي:</span><span>${grand} ج.م</span></div>`;
};
window.sendOrderWhatsapp=function(){
  const name=document.getElementById('cName').value.trim();
  const phone=document.getElementById('cPhone').value.trim();
  const oType=document.querySelector('input[name="oType"]:checked').value;
  const zSel=document.getElementById('cZone');
  const zName=zSel.options[zSel.selectedIndex]?.dataset?.name||'';
  const addr=document.getElementById('cAddr').value.trim();
  const pm=document.querySelector('input[name="pMethod"]:checked').value;
  if(!name||!phone){showToast("يرجى إدخال الاسم ورقم الموبايل");return;}
  if(oType==='delivery' && (!zName||!addr)){showToast("يرجى اختيار المنطقة وكتابة العنوان");return;}
  const sub=cart.reduce((a,b)=>a+b.unitPrice*b.qty,0);
  const fee=oType==='delivery'?Number(zSel.value||0):0;
  const disc=appliedCoupon?(appliedCoupon.type==='percent'?Math.round(sub*(appliedCoupon.val/100)):Number(appliedCoupon.val)):0;
  const grand=Math.max(0,sub-disc)+fee;
  let msg=`*طلب جديد - ${state.settings.name}*\n`;
  msg+=`━━━━━━━━━━━━━━\n`;
  msg+=`👤 العميل: ${name}\n📞 الهاتف: ${phone}\n🚚 النوع: ${oType==='delivery'?'توصيل للمنزل':'استلام من الفرع'}\n`;
  if(oType==='delivery')msg+=`📍 المنطقة: ${zName}\n🏠 العنوان: ${addr}\n`;
  msg+=`💳 الدفع: ${pm}\n━━━━━━━━━━━━━━\n*الأصناف المطلوبة:*\n`;
  cart.forEach((c,i)=>{
    msg+=`${i+1}. *${c.qty}x ${c.name}* ${c.sizeName?`(${c.sizeName})`:''} = ${c.unitPrice*c.qty} ج.م\n`;
    if(c.extras.length)msg+=`   + إضافات: ${c.extras.map(e=>e.name).join('، ')}\n`;
    if(c.note)msg+=`   📝 ملاحظة: ${c.note}\n`;
  });
  msg+=`━━━━━━━━━━━━━━\n💰 المجموع: ${sub} ج.م\n`;
  if(disc)msg+=`🎁 الخصم: -${disc} ج.م\n`;
  if(oType==='delivery')msg+=`🛵 التوصيل: ${fee} ج.م\n`;
  msg+=`✨ *الإجمالي النهائي: ${grand} ج.م*`;
  window.open(`https://wa.me/${state.settings.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
};

// Admin Panel (SHA-256 + 5 Tabs)
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

                <label class="flex justify-between items-center"><span>وضع الباقة:</span><select onchange="lic.viewOnly=(this.value==='true');saveState();window.renderAdminModal(5)" class="bg-[#092026] p-1.5 rounded-lg text-yellow-400 font-bold"><option value="false" ${!lic.viewOnly?'selected':''}>الطلبات والسلة (Pro)</option><option value="true" ${lic.viewOnly?'selected':''}>العرض الذكي (View-Only)</option></select></label>
                <label class="flex justify-between items-center"><span>توقيع منظومة تك بالفوتر:</span><input type="checkbox" ${lic.branding?'checked':''} onchange="lic.branding=this.checked;saveState()" class="w-5 h-5 accent-yellow-400"></label>
              </div>
            `}
          </div>
        `:''}
      </div>
    </div>
  </div>`;
  lucide.createIcons();
};
window.saveSettings=function(){
  const s=state.settings;
  s.name=document.getElementById('stName').value.trim();
  s.phone=document.getElementById('stPhone').value.trim();
  s.whatsapp=document.getElementById('stWa').value.trim();
  s.address=document.getElementById('stAddr').value.trim();
  s.openTime=document.getElementById('stOpen').value;
  s.closeTime=document.getElementById('stClose').value;
  s.instapay=document.getElementById('stInsta').value.trim();
  s.wallet=document.getElementById('stWallet').value.trim();
  s.mapsUrl=document.getElementById('stMaps').value.trim();
  s.fbUrl=document.getElementById('stFb').value.trim();
  s.igUrl=document.getElementById('stIg').value.trim();
  s.tiktokUrl=document.getElementById('stTk').value.trim();
  saveState();
  showToast("تم حفظ الإعدادات بنجاح");
};
window.uploadImg=function(inp,key){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const max=key==='logoUrl'?300:800;
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      c.width=img.width*sc;c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      state.settings[key]=c.toDataURL('image/jpeg',0.8);
      saveState();showToast("تم رفع الصورة بنجاح");
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
};
window.addItem=function(){
  const name=document.getElementById('niName').value.trim();
  const cat=document.getElementById('niCat').value.trim()||'أصناف متنوعة';
  const price=Number(document.getElementById('niPrice').value)||0;
  const sizes=document.getElementById('niSizes').value.trim();
  const desc=document.getElementById('niDesc').value.trim();
  if(!name||!price)return;
  state.items.push({id:Date.now(),name,cat,price,sizes,desc,img:"",avail:true});
  saveState();window.renderAdminModal(1);
};
window.delItem=function(id){state.items=state.items.filter(i=>i.id!==id);saveState();window.renderAdminModal(1);};
window.addZone=function(){
  const name=document.getElementById('nzName').value.trim();
  const fee=Number(document.getElementById('nzFee').value)||0;
  if(!name)return;
  state.zones.push({id:Date.now(),name,fee});saveState();window.renderAdminModal(2);
};
window.delZone=function(id){state.zones=state.zones.filter(z=>z.id!==id);saveState();window.renderAdminModal(2);};
window.addExtra=function(){
  const name=document.getElementById('neName').value.trim();
  const price=Number(document.getElementById('nePrice').value)||0;
  if(!name)return;

window.delExtra=function(id){state.extras=state.extras.filter(e=>e.id!==id);saveState();window.renderAdminModal(3);};
window.addCoupon=function(){
  const code=document.getElementById('ncCode').value.trim().toUpperCase();

window.unlockLicense=function(){
  const v=normalizeArabicInput(document.getElementById('licInput').value.trim());
  if(v===SECRET_LICENSE_CODE){lic.unlocked=true;saveState();window.renderAdminModal(5);showToast("تم فتح صلاحيات منظومة تك");}

// 4-Tab Excel Export/Import & HTML Export
window.exportExcel=function(){
  const wb=XLSX.utils.book_new();
  const mRows=state.items.map(i=>({"الكود":i.id,"اسم الصنف":i.name,"القسم":i.cat,"السعر الأساسي":i.price,"الأحجام (اسم:سعر)":i.sizes,"الوصف / المكونات":i.desc,"رابط الصورة":i.img,"متاح (نعم/لا)":i.avail?"نعم":"لا"}));
  const zRows=state.zones.map(z=>({"اسم المنطقة":z.name,"رسوم التوصيل (ج.م)":z.fee}));
  const eRows=state.extras.map(e=>({"اسم الإضافة":e.name,"السعر (ج.م)":e.price}));
  const sRows=[{"المفتاح": "name", "القيمة": state.settings.name},{"المفتاح": "phone", "القيمة": state.settings.phone},{"المفتاح": "whatsapp", "القيمة": state.settings.whatsapp},{"المفتاح": "address", "القيمة": state.settings.address}];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mRows),"المنيو");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(zRows),"مناطق التوصيل");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(eRows),"الإضافات");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sRows),"الإعدادات");
  XLSX.writeFile(wb,"manzouma_menu_eldabbagh.xlsx");
};
window.importExcel=function(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    if(wb.Sheets["المنيو"]){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets["المنيو"]);
      if(rows.length)state.items=rows.map((r,idx)=>({id:r["الكود"]||idx+1,name:r["اسم الصنف"]||"",cat:r["القسم"]||"عام",price:Number(r["السعر الأساسي"])||0,sizes:r["الأحجام (اسم:سعر)"]||"",desc:r["الوصف / المكونات"]||"",img:r["رابط الصورة"]||"",avail:String(r["متاح (نعم/لا)"]||"نعم").trim()!=="لا"}));
    }
    if(wb.Sheets["مناطق التوصيل"]){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets["مناطق التوصيل"]);
      if(rows.length)state.zones=rows.map((r,idx)=>({id:idx+1,name:r["اسم المنطقة"]||"",fee:Number(r["رسوم التوصيل (ج.م)"])||0}));
    }
    if(wb.Sheets["الإضافات"]){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets["الإضافات"]);
      if(rows.length)state.extras=rows.map((r,idx)=>({id:idx+1,name:r["اسم الإضافة"]||"",price:Number(r["السعر (ج.م)"])||0}));
    }
    saveState();window.renderAdminModal(5);showToast("تم استيراد ملف الإكسل بنجاح!");
  };
  r.readAsArrayBuffer(f);
};
window.syncGoogleSheet=async function(){
  const u=document.getElementById('gsUrl').value.trim();
  if(!u){showToast("أدخل رابط الشيت أولاً");return;}
  const m=u.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m){showToast("رابط Google Sheets غير صالح");return;}
  const expUrl=`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`;
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch(expUrl,{signal:ctrl.signal});
    clearTimeout(t);
    const buf=await res.arrayBuffer();
    window.importExcel({files:[new File([buf],"sheet.xlsx")]});
  }catch(e){showToast("تعذر الجلب المباشر، تأكد أن الشيت متاح للجميع");}
};
window.exportHtml=function(){
  const html=document.documentElement.outerHTML;
  const blob=new Blob(["<!DOCTYPE html>\n"+html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index.html";
  a.click();
};
